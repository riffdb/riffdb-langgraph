name: RiffDB compatibility

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      riffdb_ref:
        description: 'Full RiffDB commit or main; empty uses the adapter pin'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: riffdb-compatibility-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  application-compatibility:
    name: Application compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/riffdb/target
    steps:
      - name: Check out adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: adapter
          persist-credentials: false
      - name: Select RiffDB revision
        id: riffdb
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ inputs.riffdb_ref }}
        run: |
          revision="$(cat adapter/.github/riffdb-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == schedule ]]; then revision=main; fi
          if [[ -n "$REQUESTED_REF" ]]; then revision="$REQUESTED_REF"; fi
          [[ "$revision" =~ ^([0-9a-f]{40}|main)$ ]]
          printf 'revision=%s\n' "$revision" >>"$GITHUB_OUTPUT"
      - name: Check out RiffDB
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: riffdb/riffdb
          ref: ${{ steps.riffdb.outputs.revision }}
          path: riffdb
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Cargo sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-compatibility-${{ runner.os }}-${{ hashFiles('riffdb/Cargo.lock') }}
      - name: Build selected RiffDB CLI
        working-directory: riffdb
        run: cargo build --locked --release -p riffdb-cli --bin riffdb
      - name: Check adapter application
        working-directory: adapter
        run: ../riffdb/target/release/riffdb application check
